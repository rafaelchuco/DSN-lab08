version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techstore-postgres
    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: techstore_user
      POSTGRES_PASSWORD: techstore_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore_user -d techstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techstore-network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: techstore-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_NAME: techstore
      DB_USER: techstore_user
      DB_PASSWORD: techstore_pass
      JWT_SECRET: production_secret_change_me_in_production
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
    networks:
      - techstore-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: techstore-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:4000
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
    networks:
      - techstore-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  techstore-network:
    driver: bridge
